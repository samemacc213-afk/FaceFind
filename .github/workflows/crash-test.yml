name: Crash Test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/crash-test.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern app-release.apk
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install app-release.apk
            adb logcat -c
            adb shell monkey -p $(adb shell pm list packages -3 | cut -d: -f2 | tr -d '\r') -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > log.txt
      - name: Show crash
        run: |
          grep -E "FATAL|AndroidRuntime|Caused by|UnsatisfiedLink|Process: " -A20 log.txt | head -100 || true
          echo "=== TAIL ==="
          tail -60 log.txt
