name: Build FaceFind APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.facefind.app /tmp/facefind_android

      - name: Copy app source
        run: |
          cp mobile/pubspec.yaml /tmp/facefind_android/pubspec.yaml
          cp -r mobile/lib /tmp/facefind_android/lib

      - name: Add AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/facefind_android/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4455023088168031~7152639159"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("<application", "<application>" + meta, 1) if False else s.replace("<application", "<application\n        " + meta, 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd /tmp/facefind_android
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: facefind-release-apk
          path: /tmp/facefind_android/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/facefind_android/build/app/outputs/flutter-apk/app-release.apk
